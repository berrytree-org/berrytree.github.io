{{/* Theme toggle — interaction script */}}
<script>
(function() {
  function getTheme() {
    return document.documentElement.getAttribute('data-theme') || 'light';
  }

  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('theme', t);
    var label = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    document.querySelectorAll('.theme-toggle').forEach(function(btn) {
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
      if (t === 'dark') {
        btn.classList.add('theme-toggle--dark');
        btn.classList.remove('theme-toggle--light');
      } else {
        btn.classList.add('theme-toggle--light');
        btn.classList.remove('theme-toggle--dark');
      }
    });
  }

  // Click handler — toggle between light and dark
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.theme-toggle');
    if (btn) {
      e.preventDefault();
      setTheme(getTheme() === 'dark' ? 'light' : 'dark');
    }
  });

  // Keyboard: Enter and Space activate the toggle
  document.addEventListener('keydown', function(e) {
    var btn = e.target.closest('.theme-toggle');
    if (btn && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      setTheme(getTheme() === 'dark' ? 'light' : 'dark');
    }
  });

  // Initialize button state on page load
  setTheme(getTheme());
})();
</script>

{{/* V16: Back-to-top button — appears after scrolling 600px */}}
<button id="backToTop" class="back-to-top" aria-label="Back to top" title="Back to top">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
    <path d="M10 16V4M10 4L4 10M10 4L16 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<script>
(function() {
  var btn = document.getElementById('backToTop');
  if (!btn) return;

  // Show/hide based on scroll position
  window.addEventListener('scroll', function() {
    if (window.scrollY > 600) {
      btn.classList.add('visible');
    } else {
      btn.classList.remove('visible');
    }
  });

  // Scroll to top — respect reduced motion preference
  btn.addEventListener('click', function() {
    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
  });
})();
</script>
